# Build and deploy the site to GitHub Pages.
#
# Media pipeline: originals live in _media/ and are never published. The
# optimise step regenerates the web-ready copies in images/ from them, skipping
# anything whose source has not changed, and commits the results back so the
# repo always has everything needed to serve the site (and to preview it
# locally without running the encoder).
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write      # the optimise step commits regenerated media back
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ffmpeg is not preinstalled on the runner; ImageMagick is, but apt
      # pulls both in a few seconds, which beats building a container here.
      # The pinned image in tools/Dockerfile is for local runs.
      - name: Install ffmpeg and ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg imagemagick

      - name: Generate web-ready media from _media/
        id: media
        run: python3 tools/optimize.py

      - name: Commit regenerated media
        run: |
          if [ -z "$(git status --porcelain -- images tools/.media-manifest.json)" ]; then
            echo "images/ already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images tools/.media-manifest.json
          git commit -m "Regenerate web media from _media/ [skip ci]"
          git push

      - name: Stamp dates, pagers, project list and asset versions
        # Bakes them into the HTML at deploy time, so a visitor's browser
        # fetches nothing to render a complete page and neither can fail at
        # view time. Run the same script locally with --check to preview.
        run: python3 .github/scripts/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
